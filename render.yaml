# Render Blueprint — Streetmix Innovation Branch
#
# https://render.com/docs/blueprint-spec
#
# How to deploy:
#   1. Sign in at https://dashboard.render.com (free GitHub auth works)
#   2. New → Blueprint
#   3. Connect your `yunching0513/Street-mix` fork
#   4. Select branch `claude/beautiful-rubin-jl3pif`
#      (or `main` after PR #1 is merged — keep this in sync with the
#      `branch:` field below)
#   5. Render reads this file and provisions the service
#   6. First build takes ~5-8 min (workspace builds + Parcel client bundle)
#   7. Once live you'll get a URL like
#      https://streetmix-innovation.onrender.com
#
# Free plan notes:
#   - The service sleeps after 15 min of inactivity. First request after
#     sleep cold-starts in ~30s.
#   - 512 MB memory, 750 hours/month. Plenty for review/testing.

services:
  - type: web
    name: streetmix-innovation
    runtime: node
    plan: free
    region: oregon
    branch: claude/beautiful-rubin-jl3pif
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      # NODE_ENV is intentionally NOT set here. Render automatically
      # propagates NODE_ENV=production into npm's environment as
      # NPM_CONFIG_PRODUCTION=true, which makes `npm install` skip
      # devDependencies and breaks the build (tsc/parcel are dev deps).
      # We set NODE_ENV=production inline in startCommand instead so
      # the runtime still behaves as production.
      # Skip Auth0 / Postgres / Cloudinary / Sentry / etc.
      - key: OFFLINE_MODE
        value: "true"
      # Skip the Cypress binary download (blocked anyway on most CI).
      - key: CYPRESS_INSTALL_BINARY
        value: "0"
      - key: COOKIE_SESSION_SECRET
        generateValue: true
    # NPM_CONFIG_PRODUCTION=false + --include=dev: defeat every way a
    # PaaS can make npm skip devDependencies (tsc/parcel live there).
    buildCommand: CYPRESS_INSTALL_BINARY=0 NPM_CONFIG_PRODUCTION=false NODE_ENV=development npm ci --include=dev --no-audit --no-fund && npm run build:prod
    startCommand: NODE_ENV=production npm run start:prod
